<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat_MN</title>
    <style>
        :root { --bg: #000; --panel: #0b0b0b; --muted: #555; --accent: #3f51b5; --card: #424242; }
        html,body{height:100%;}
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing:antialiased;
        }
        #chat-container {
            width: 95vw;
            max-width: 1400px;
            height: 95vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #424242;
            border-radius: 12px;
            overflow: hidden;
            background-color: #00000;
            position: relative;
        }
        /* Controls */
        #chat-controls {
            position: absolute;
            top: 10px;
            right: 20px;
            z-index: 12;
            display: flex;
            gap: 8px;
        }
        .control-button {
            background-color: var(--card);
            color: white;
            border: 1px solid #616161;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .control-button:hover { background-color: #616161; }

        #chat-history {
            flex-grow: 1;
            padding: 20px;
            padding-top: 50px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #chat-placeholder {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--muted);
            font-size: 3rem;
            font-weight: bold;
            user-select: none;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            margin-bottom: 8px;
            line-height: 1.6;
            animation: fadeIn 0.22s ease-in-out;
            position: relative;
            word-break: break-word;
        }
        @keyframes fadeIn { from {opacity:0; transform: translateY(8px)} to {opacity:1; transform: translateY(0)} }
        .user-message { background-color: var(--accent); align-self: flex-end; color: #fff; }
        .ai-message { background-color: transparent; align-self: flex-start; padding: 5px 0; border-radius: 0; max-width: 99%; text-align: left; }
        .system-notification { font-style: italic; color: #ffc107; background-color: rgba(255,193,7,0.08); align-self:center; max-width:90%; text-align:center; font-size:13px; padding:6px 10px; border-radius:8px; }

        #image-preview-container {
            padding: 10px 16px;
            background-color: #111;
            position: relative;
            display: none;
            align-items: center;
            gap: 12px;
        }
        #image-preview { max-height: 100px; border-radius: 8px; display:block; }
        #file-info { color: #ddd; font-size: 14px; }
        #remove-image-button { position: absolute; top: 6px; right: 10px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-weight: bold; }

        #input-area { display:flex; padding:10px; border-top:1px solid #333; align-items:center; gap:8px; }
        #attach-file-button { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:6px; }
        #user-input { flex-grow:1; background-color:#272727; color: #fff; border: none; padding:12px; border-radius:8px; resize:none; font-size:15px; min-height:44px; }
        #send-button { background-color:#f2f2f2; color:black; border:none; padding:22px 22px; border-radius:8px; cursor:pointer; font-weight:bold; }
        #send-button:hover { background-color:#303f9f; color:#fff; }
        .file-box { background:#616161; padding:10px; border-radius:10px; display:inline-block; }
        .file-download { display:inline-block; margin-top:8px; font-size:13px; color:#e0e0e0; text-decoration:underline; cursor:pointer; }
        a.download-link { color:inherit; text-decoration:none; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-controls">
            <button id="save-chat-button" class="control-button">Lưu Chat</button>
            <button id="load-chat-button" class="control-button">Tải Chat</button>
            <input type="file" id="load-chat-input" accept=".json" style="display:none" />
        </div>

        <div id="chat-history">
            <div id="chat-placeholder">CHASE_X</div>
        </div>

        <div id="image-preview-container">
            <img id="image-preview" src="" alt="preview" />
            <div id="file-info"></div>
            <button id="remove-image-button">×</button>
        </div>

        <div id="input-area">
            <button id="attach-file-button" title="Đính kèm file">💽</button>
            <input type="file" id="file-input" style="display:none" />
            <textarea id="user-input" placeholder="Hỏi bất cứ điều gì.." rows="1"></textarea>
            <button id="send-button">Gửi</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // DOM
    const chatHistory = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const chatPlaceholder = document.getElementById('chat-placeholder');
    const attachFileButton = document.getElementById('attach-file-button');
    const fileInput = document.getElementById('file-input');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const fileInfo = document.getElementById('file-info');
    const removeImageButton = document.getElementById('remove-image-button');
    const saveChatButton = document.getElementById('save-chat-button');
    const loadChatButton = document.getElementById('load-chat-button');
    const loadChatInput = document.getElementById('load-chat-input');

    // State
    let selectedFile = null;

    // IMPORTANT: Thay API_KEY vào đây trước khi chạy.
    const API_KEY = 'AIzaSyDm5t_0OiuEIXEuCBQ5UORlUE1O1l21N_g';
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
    
    // --- NÂNG CẤP: THÊM HƯỚNG DẪN DÙNG BOLD, ITALIC VÀO SYSTEM PROMPT ---
    const systemInstruction = {
        role: "model",
        parts: [{
                    text: "Bạn là một trợ lý AI tên là ChatMN, cực kỳ vui tính, thân thiện và một chút nhí nhảnh. Hãy luôn trả lời bằng giọng văn của giới trẻ Việt Nam, sử dụng emoji và icon (như :>, :3, ^^) một cách tự nhiên. Giữ câu trả lời ngắn gọn, dễ thương và đôi khi pha trò nhé! QUAN TRỌNG: LUÔN LUÔN trả lời bằng Tiếng Việt, không dùng ngôn ngữ nào khác."
                }]
    };

    let conversationHistory = [systemInstruction];

    // Helpers
    function getBase64FromDataUrl(dataUrl) {
        return dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
    }
    function dataUrlFromParts(mime, base64) {
        return `data:${mime};base64,${base64}`;
    }
    function humanFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B','KB','MB','GB','TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
    function ensurePlaceholderHidden() {
        if (chatPlaceholder) chatPlaceholder.style.display = 'none';
    }
    function escapeHtml(unsafe) {
        return (''+unsafe).replace(/[&<>\"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#039;"}[m];});
    }

    // --- NÂNG CẤP: HÀM MỚI ĐỂ "DỊCH" MARKDOWN SANG HTML ---
    function formatMarkdown(text) {
        // 1. Chuyển đổi an toàn các ký tự HTML đặc biệt
        let safeText = escapeHtml(text);

        // 2. Chuyển đổi markdown thành thẻ HTML
        // Lưu ý: Thay thế ** (đậm) trước * (nghiêng) để tránh xung đột
        return safeText
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')  // Bold: **text** -> <strong>text</strong>
            .replace(/\*(.*?)\*/g, '<em>$1</em>')          // Italic: *text* -> <em>text</em>
            .replace(/\n/g, '<br>');                           // Newline -> <br>
    }

    // Typing effect
    function typeText(element, text, speed, callback) {
        let index = 0;
        function type() {
            if (index < text.length) {
                // `text` ở đây đã là HTML đã được định dạng, chỉ cần hiển thị
                element.innerHTML = text.substring(0, index + 1);
                index++;
                setTimeout(type, speed);
            } else if (callback) callback();
        }
        type();
    }

    // Append messages
    function appendMessage(text, className, useTypingEffect = true, existingElement = null) {
        const messageElement = existingElement || document.createElement('div');
        if (!existingElement) {
            messageElement.className = 'message ' + className;
            chatHistory.appendChild(messageElement);
        }
        
        // --- NÂNG CẤP: SỬ DỤNG HÀM formatMarkdown TRƯỚC KHI HIỂN THỊ ---
        const formattedText = formatMarkdown(text);
        
        if (className.includes('ai-message') && useTypingEffect) {
            const speedPerChar = 0.2; // ms per char
            messageElement.innerHTML = '';
            // Truyền HTML đã được định dạng vào hàm typeText
            typeText(messageElement, formattedText, speedPerChar, () => chatHistory.scrollTop = chatHistory.scrollHeight);
        } else {
            // Hiển thị trực tiếp HTML đã được định dạng
            messageElement.innerHTML = formattedText;
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        return messageElement;
    }

    function appendUserMessageWithFile(text, fileData) {
        const messageContainer = document.createElement('div');
        messageContainer.className = 'message user-message';

        if (fileData.mimeType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = dataUrlFromParts(fileData.mimeType, fileData.base64);
            img.style.maxHeight = '200px'; img.style.borderRadius = '12px';
            img.style.display = 'block'; img.style.marginBottom = text ? '10px' : '0';
            messageContainer.appendChild(img);
        } else {
            const box = document.createElement('div');
            box.className = 'file-box';
            box.innerHTML = `<strong>Đã gửi file:</strong> ${escapeHtml(fileData.name)}<br><small>${escapeHtml(fileData.mimeType)} • ${humanFileSize(fileData.size)}</small>`;
            messageContainer.appendChild(box);
        }

        if (text) {
            const textElement = document.createElement('div');
            textElement.style.marginTop = '8px';
            textElement.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
            messageContainer.appendChild(textElement);
        }

        const dl = document.createElement('div');
        dl.className = 'file-download';
        const a = document.createElement('a');
        a.className = 'download-link'; a.href = dataUrlFromParts(fileData.mimeType, fileData.base64);
        a.download = fileData.name; a.textContent = 'Tải file xuống';
        dl.appendChild(a);
        messageContainer.appendChild(dl);

        chatHistory.appendChild(messageContainer);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function appendSimpleUserMessage(text) {
        const el = document.createElement('div');
        el.className = 'message user-message';
        el.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
        chatHistory.appendChild(el);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }
    
    // --- Toàn bộ các hàm xử lý logic khác được giữ nguyên ---
    // (Dán lại toàn bộ code của các hàm này từ file trước của bạn)
    function appendSystemNotification(text) {
        const el = document.createElement('div');
        el.className = 'message system-notification';
        el.innerHTML = escapeHtml(text);
        chatHistory.appendChild(el);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }
    attachFileButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > 15 * 1024 * 1024) {
            alert('File quá lớn, chọn file < 15MB nhé.');
            event.target.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
            const dataUrl = reader.result || '';
            const base64 = getBase64FromDataUrl(dataUrl);
            selectedFile = {
                mimeType: file.type || 'application/octet-stream', name: file.name || 'file', base64, size: file.size
            };
            if (selectedFile.mimeType.startsWith('image/')) {
                imagePreview.src = dataUrl; imagePreview.style.display = 'block'; fileInfo.textContent = '';
            } else {
                imagePreview.src = ''; imagePreview.style.display = 'none';
                fileInfo.textContent = `File đã chọn: ${selectedFile.name} — ${humanFileSize(selectedFile.size)}`;
            }
            imagePreviewContainer.style.display = 'flex';
        };
        reader.readAsDataURL(file);
    });
    removeImageButton.addEventListener('click', clearFileSelection);
    function clearFileSelection() {
        fileInput.value = ''; selectedFile = null; imagePreview.src = '';
        imagePreview.style.display = 'none'; fileInfo.textContent = '';
        imagePreviewContainer.style.display = 'none';
    }
    sendButton.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
        //if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    function sendMessage() {
        const messageText = userInput.value.trim();
        if (!messageText && !selectedFile) return;
        if (!API_KEY || API_KEY.includes('YOUR_API_KEY')) {
            alert('Thay API_KEY vào biến API_KEY trong file này trước khi gửi.');
            return;
        }
        ensurePlaceholderHidden();
        const userParts = [];
        if (selectedFile) {
            userParts.push({ inline_data: { mime_type: selectedFile.mimeType, data: selectedFile.base64 } });
            appendUserMessageWithFile(messageText, selectedFile);
        } else if (messageText) { appendSimpleUserMessage(messageText); }
        if (messageText) userParts.push({ text: messageText });
        conversationHistory.push({ role: 'user', parts: userParts });
        userInput.value = '';
        clearFileSelection();
        const waitingMessage = appendMessage('', 'ai-message', false); // Gửi chuỗi rỗng
        waitingMessage.innerHTML = 'ChatMN đang nghĩ...'; // Thêm chữ chờ
        performApiCall(conversationHistory, waitingMessage);
    }
    function performApiCall(historyPayload, messageElementToUpdate) {
        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: historyPayload })
        }).then(async response => {
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch(e) { data = text; }
            if (!response.ok) { console.error('API lỗi chi tiết:', data); throw new Error(`API ${response.status}: ${JSON.stringify(data)}`); }
            return data;
        }).then(data => {
            let aiResponse = 'Mình không biết phải trả lời sao...';
            try {
                if (data?.candidates && data.candidates.length) {
                    const candidate = data.candidates[0];
                    if (candidate?.content?.parts && candidate.content.parts.length) {
                        const textPart = candidate.content.parts.find(p => typeof p.text === 'string');
                        if (textPart) aiResponse = textPart.text;
                    }
                    if (candidate.finishReason === 'MAX_TOKENS') aiResponse += '\n\n*(Bị ngắt do giới hạn từ)*';
                    if (candidate.finishReason === 'SAFETY') aiResponse = 'Cái này hơi nhạy cảm nên mình không thể trả lời.';
                }
            } catch (e) { console.error('Xử lý response error', e); }
            messageElementToUpdate.innerHTML = '';
            appendMessage(aiResponse, 'ai-message', true, messageElementToUpdate);
            conversationHistory.push({ role: 'model', parts: [{ text: aiResponse }] });
        }).catch(error => {
            console.error('Lỗi khi gọi API:', error);
            messageElementToUpdate.className = 'message ai-message system-notification';
            messageElementToUpdate.textContent = `Lỗi: ${error.message}`;
            chatHistory.scrollTop = chatHistory.scrollHeight;
        });
    }
    saveChatButton.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(conversationHistory, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `chatmn_${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
    });
    loadChatButton.addEventListener('click', () => loadChatInput.click());
    loadChatInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                if (!Array.isArray(parsed)) throw new Error('File không đúng định dạng (cần một mảng JSON).');
                conversationHistory = parsed;
                rebuildChatFromHistory();
                appendSystemNotification('Đã tải chat từ file.');
            } catch (err) { alert('Không đọc được file: ' + err.message); }
        };
        reader.readAsText(file);
        e.target.value = '';
    });
    function rebuildChatFromHistory() {
        chatHistory.innerHTML = '';
        const nonSystem = conversationHistory.filter(m => m.role !== 'system' && m.role !== 'model');
        if (!nonSystem.length) {
            chatHistory.appendChild(chatPlaceholder);
            chatPlaceholder.style.display = 'flex';
            return;
        }
        conversationHistory.forEach(item => {
            if (item.role === 'system') return;
            const parts = Array.isArray(item.parts) ? item.parts : [];
            if (item.role === 'user') {
                let textAccum = '';
                parts.forEach(p => {
                    if (p.inline_data) {
                        const inline = p.inline_data;
                        const fileData = {
                            mimeType: inline.mime_type || 'application/octet-stream',
                            name: inline.name || 'file',
                            base64: inline.data || '',
                            size: inline.size || 0
                        };
                        appendUserMessageWithFile(textAccum || '', fileData);
                        textAccum = '';
                    } else if (p.text) { textAccum += (textAccum ? '\n' : '') + p.text; }
                });
                if (textAccum) appendSimpleUserMessage(textAccum);
            } else if (item.role === 'model') {
                const modelText = parts.map(p => p.text || '').join('\n').trim();
                if (modelText) appendMessage(modelText, 'ai-message', false);
            }
        });
    }
});
</script>
</body>
</html>
